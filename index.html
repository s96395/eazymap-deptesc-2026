<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>部門密室逃脫活動報名</title>
  
  
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <div class="header-brand">
    <span class="brand-icon">🔐</span>
    <span class="brand-title">部門密室逃脫活動</span>
  </div>
  <div class="header-user">
    <span id="user-name" class="hidden"></span>
    <button id="btn-logout" class="btn-outline hidden">登出</button>
  </div>
</header>

<main>

  <!-- 登入頁 -->
  <section id="section-login">
    <div class="login-keyhole">🗝️</div>
    <h1 class="login-title">2026 部門密室逃脫</h1>
    <p class="login-sub">9 月 11 日（五）19:00 ／ 請以公司 Google 帳號登入後選擇主題</p>
    <div class="login-notice">
      ⚠️ 本次活動開放攜帶眷屬，眷屬費用請自行負擔，請事先確認。
    </div>
    <button id="btn-login" class="btn-google">
      <span class="btn-google-icon">G</span>
      使用 Google 帳號登入
    </button>
  </section>

  <!-- 報名主頁（所有人，含管理員） -->
  <section id="section-main" class="hidden">

    <p class="section-title">我的預約</p>
    <div class="panel" id="my-booking">
      <p class="no-booking">尚未選擇主題，請從下方選一個你想玩的密室。</p>
    </div>

    <p class="section-title">各主題名額總覽</p>
    <div class="overview-wrap">
      <table class="overview-table">
        <thead>
          <tr>
            <th>主題</th>
            <th>報名進度</th>
            <th style="text-align:center">剩餘名額</th>
          </tr>
        </thead>
        <tbody id="theme-overview">
          <tr><td colspan="3" class="loading-cell">載入中…</td></tr>
        </tbody>
      </table>
    </div>

    <p class="section-title">選擇密室主題</p>
    <p style="font-size:13px; color:#7A7870; margin-bottom:16px; margin-top:-10px;">
      點選下方連結可查看各主題介紹，選好後按「選擇此主題」完成報名。<br>
      ⚠️ 若攜帶眷屬，眷屬費用需自行負擔，請事先確認。
    </p>
    <div class="cards-grid" id="theme-cards"></div>

  </section>

</main>

<script type="module" src="app.js"></script>
</body>
</html>
