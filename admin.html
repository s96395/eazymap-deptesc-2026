<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>易圖野餐日｜管理後台</title>
  <meta name="description" content="易圖野餐日分組報名管理後台" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=10" />
</head>
<body>

<header class="site-header">
  <a href="admin.html" class="header-brand">
    <img src="images/logo.png" alt="Easymap 易圖科技" class="brand-logo" />
    <span class="brand-title">野餐日管理後台</span>
  </a>
  <div class="header-user">
    <span id="user-name" class="hidden user-chip"></span>
    <a href="index.html" class="btn-outline">回報名頁</a>
    <button id="btn-logout" class="btn-outline hidden">登出</button>
  </div>
</header>

<main>

  <section id="section-login" class="card login-card">
    <h2 class="block-title">管理員登入</h2>
    <p class="muted">這一頁只開放福委管理員使用。</p>
    <button id="btn-login" class="btn-primary btn-login">使用公司 Google 帳號登入</button>
  </section>

  <section id="section-denied" class="card login-card hidden">
    <h2 class="block-title">沒有權限</h2>
    <p class="muted">你的帳號不在管理員名單內。</p>
    <a href="index.html" class="btn-primary btn-login">回報名頁</a>
  </section>

  <section id="section-admin" class="hidden">
    <div class="section-head">
      <h2 class="block-title">報名狀況</h2>
      <p class="muted" id="admin-event"></p>
    </div>

    <p class="card lock-note" id="lock-note"></p>

    <div class="stats" id="stats"></div>

    <div class="tabs">
      <button class="tab-btn tab-active" data-tab="groups">分組名單</button>
      <button class="tab-btn" data-tab="absent">不能參加</button>
      <button class="tab-btn" data-tab="tools">設定</button>
    </div>

    <div id="panel-groups" class="tab-panel">
      <div class="toolbar">
        <p class="muted">每組 <span class="group-cap"></span> 人。可以在各組卡片裡加人、換組、刪除或改隊名。</p>
        <button id="btn-export-groups" class="btn-primary">匯出分組名單 CSV</button>
      </div>
      <div class="groups-grid" id="admin-groups"></div>
    </div>

    <div id="panel-absent" class="tab-panel hidden">
      <div class="toolbar">
        <p class="muted">報名截止後請把這份名單交給處長。</p>
        <button id="btn-export-absent" class="btn-primary">匯出不能參加名單 CSV</button>
      </div>
      <div class="card">
        <h3 class="card-heading">幫同仁登記不能參加</h3>
        <p class="muted">如果他已經在組裡，會一起移出組別。已經登記過的人再送一次就是修改原因。</p>
        <form id="admin-absence-form" class="admin-absence-form">
          <div>
            <label for="aa-account">帳號</label>
            <input id="aa-account" type="text" placeholder="例如 yoyoshen 或完整信箱" autocomplete="off" autocapitalize="off" spellcheck="false" required />
          </div>
          <div>
            <label for="aa-type">原因</label>
            <select id="aa-type"></select>
          </div>
          <div class="aa-note">
            <label for="aa-note">說明（選填）</label>
            <input id="aa-note" type="text" maxlength="200" />
          </div>
          <button type="submit" class="btn-primary">登記</button>
        </form>
      </div>
      <div class="card table-wrap">
        <table>
          <thead>
            <tr><th>姓名</th><th>帳號</th><th>原因</th><th>說明</th><th>回報時間</th><th></th></tr>
          </thead>
          <tbody id="absent-body"></tbody>
        </table>
      </div>
    </div>

    <div id="panel-tools" class="tab-panel hidden">
      <div class="card">
        <h3 class="card-heading">開放報名 / 重新計算人數</h3>
        <p class="muted">第一次上線時請按一次，系統會建立 8 個組別。之後如果發現某組人數跟名單對不起來，也可以按這個重算。隊名不會被清掉。</p>
        <button id="btn-rebuild" class="btn-outline">建立組別並重新計算</button>
      </div>
    </div>
  </section>

</main>

<script type="module" src="admin.js?v=12"></script>
</body>
</html>
